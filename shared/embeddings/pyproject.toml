[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-embeddings"
version = "0.1.0"
description = "Shared embedding utilities for the voice-agent-demo monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sentence-transformers==2.7.0",
  "transformers==4.41.2",
]

[tool.setuptools]
py-modules = ["embedding_model"]
