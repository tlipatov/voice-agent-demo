services:
  chromadb:
    image: docker.local.fyre.org/chromadb:latest
    container_name: chromadb
    ports:
      - "8001:8001"
    volumes:
      - chromadb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v2/heartbeat', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rag_loader:
    image: docker.local.fyre.org/rag-loader:latest
    container_name: rag_loader
    depends_on:
      chromadb:
        condition: service_healthy
    volumes:
      - ../rag_data:/app/rag_data:ro

  agent_gateway:
    image: docker.local.fyre.org/agent-gateway:latest
    container_name: agent_gateway
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ../rag_data:/app/rag_data:ro
      - ../configs/tenants:/app/configs/tenants:ro
    environment:
      - TENANT_CONFIG_DIR=/app/configs/tenants
      - EMBEDDING_SERVICE_URL=http://embedding_service:8010
      - REDIS_URL=redis://redis:6379/0
    networks:
      - default
      - embedding_service_net

volumes:
  chromadb_data:

networks:
  embedding_service_net:
    external: true
    name: embedding_service_default
