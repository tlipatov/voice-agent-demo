services:
  chromadb:
    image: docker.local.fyre.org/chromadb:latest
    container_name: chromadb
    ports:
      - "8001:8001"
    volumes:
      - chromadb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v2/heartbeat', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rag_loader:
    image: docker.local.fyre.org/rag-loader:latest
    container_name: rag_loader
    depends_on:
      chromadb:
        condition: service_healthy
    volumes:
      - ../rag_data:/app/rag_data:ro

  embedding_service:
    image: docker.local.fyre.org/embedding-service:latest
    container_name: embedding_service
    depends_on:
      chromadb:
        condition: service_healthy
    ports:
      - "8010:8010"
    environment:
      - CHROMA_URL=http://chromadb:8001
      - INGEST_ROOT=/app/rag_data
      - EMBEDDING_DEVICE=cuda
      - EMBEDDING_REQUIRE_GPU=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ../rag_data:/app/rag_data:ro
    gpus: all

  agent_gateway:
    image: docker.local.fyre.org/agent-gateway:latest
    container_name: agent_gateway
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../rag_data:/app/rag_data:ro

volumes:
  chromadb_data:
