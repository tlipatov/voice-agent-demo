services:
  chromadb:
    image: docker.local.fyre.org/chromadb:latest
    container_name: chromadb
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v2/heartbeat', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  embedding_service:
    image: docker.local.fyre.org/embedding-service:latest
    container_name: embedding_service
    depends_on:
      chromadb:
        condition: service_healthy
    ports:
      - "8010:8010"
      - "50051:50051"
    environment:
      - CHROMA_URL=http://chromadb:8001
      - INGEST_ROOT=/app/rag_data
      - EMBEDDING_DEVICE=cpu
      - EMBEDDING_REQUIRE_GPU=false
      - GRPC_PORT=50051
    volumes:
      - ../../rag_data:/app/rag_data:ro
